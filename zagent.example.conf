# Example configuration for zagent.
# Copy this file to one of the following locations:
#   $XDG_CONFIG_HOME/zagent
#   ~/.config/zagent
#
# Environment variables override values from this file.

# Optional. Select a built-in provider preset: openai or deepseek.
# The preset supplies AI_URL, AI_MODEL, and the name of the environment
# variable holding the API key (DEEPSEEK_API_KEY for deepseek). Anything set
# below, or via the equivalent OPENAI_* variables, still takes precedence.
#
# When this is unset, the preset is autodetected from whichever API key the
# environment exports: OPENAI_API_KEY selects openai, DEEPSEEK_API_KEY selects
# deepseek, and openai wins if both are exported.
#
# Left commented out because the AI_URL and AI_MODEL below configure OpenAI.
# AI_PROVIDER=deepseek

# Required for remote Responses-compatible endpoints.
# Under AI_PROVIDER=deepseek, set DEEPSEEK_API_KEY in the environment instead.
#
# Note that a key set here also turns the autodetection described above off:
# the key stays paired with the AI_URL below rather than following an
# unrelated exported variable.
AI_KEY=sk-your-api-key-here

# Optional. API base URL; zagent appends /responses (no Chat Completions fallback).
# Defaults to https://api.openai.com/v1; DeepSeek uses https://api.deepseek.com.
AI_URL=https://api.openai.com/v1

# Optional. Defaults to gpt-4o-mini
# DeepSeek example: deepseek-flash or deepseek-v4-pro. Model names are sent unchanged.
AI_MODEL=gpt-4o-mini

# Optional. Initial Responses max_output_tokens; defaults to 8192, the most
# DeepSeek's chat models accept.
# On token truncation, retry up to 3 times with doubled budgets (growth cap 8192).
# A reply still cut off is continued from where it stopped, up to 8 times.
AI_MAX_TOKENS=8192

# Optional. Defaults to 200
AI_MAX_ITERATIONS=200

# Optional. Defaults to 3
# How many completion checks one question may cost. After every turn that used
# a tool, zagent asks the model — in a separate request, with the tools left
# out — whether the request is really finished, and sends it back to work when
# it is not. Set to 0 to trust the model's own word instead.
AI_MAX_VERIFICATIONS=3

# Optional. Defaults to true
# Render the assistant's markdown for a terminal: headings, emphasis, inline
# code and fenced blocks get styling and a hanging indent instead of being
# printed as literal markers. Output that is not a terminal — a pipe, a file,
# a redirect — always gets the raw markdown, whatever this is set to, so
# `zagent "..." > notes.md` keeps its structure.
# Accepts 1/true/yes/on or 0/false/no/off.
AI_MARKDOWN=true

# Optional. Defaults to 48000
# Estimated token budget for the conversation. Once the estimate crosses this,
# older messages are replaced by a model-written summary and the newest
# AI_COMPACT_KEEP messages are kept as they are. 0 disables automatic
# compaction; /compact still works on demand.
AI_COMPACT_THRESHOLD=48000

# Optional. Defaults to 16
# How many of the newest messages are kept verbatim when compacting. Larger
# values preserve more detail and cost more context; 2 is the minimum.
AI_COMPACT_KEEP=16

# Optional. Defaults to true
# Keep durable notes between sessions in .zagent/memory.md in the workspace,
# and expose the remember tool. The agent saves a note when the user asks it
# to, when it calls remember at a key point, or when the end-of-turn extractor
# decides something durable emerged. /memory lists them, /forget removes them.
# Accepts 1/true/yes/on or 0/false/no/off.
AI_MEMORY=true

# Optional. Defaults to true
# Run the conservative end-of-turn memory extractor. Set to 0 to keep the
# remember tool and the /remember command but skip the extra request after
# every turn.
AI_MEMORY_AUTO=true

# MCP servers are described in a separate file, mcp.json, in the same
# directory as this one — there is no equivalent setting here, and no
# environment variable. See mcp.example.json for its members, and note that
# only this user-level file is read: zagent never starts a server named by a
# file in the directory it happens to be running in.

# Tool sandbox options are environment variables (not config file keys):
# AI_TOOL_NETWORK=1  # explicitly share host networking with tool sandboxes
# AI_SESSION_FILE=/absolute/path/outside/workspace/session.json
# AI_MEMORY_FILE=/path/to/notes.md  # store memory somewhere else
# Start zagent in the project directory; only that directory is writable.
# Requires Linux, bubblewrap and GNU timeout. Zig compiler version: 0.17.0.
