# Example configuration for zagent.
# Copy this file to one of the following locations:
#   $XDG_CONFIG_HOME/zagent
#   ~/.config/zagent
#
# Environment variables override values from this file.

# Optional. Select a built-in provider preset: openai or deepseek.
# The preset supplies AI_URL, AI_MODEL, and the name of the environment
# variable holding the API key (DEEPSEEK_API_KEY for deepseek). Anything set
# below, or via AI_* environment variables, still takes precedence.
#
# When this is unset, the preset is autodetected from whichever API key the
# environment exports: OPENAI_API_KEY selects openai, DEEPSEEK_API_KEY selects
# deepseek, and openai wins if both are exported.
#
# Left commented out because the AI_URL and AI_MODEL below configure OpenAI.
# AI_PROVIDER=deepseek

# Required for remote Responses-compatible endpoints.
# Under AI_PROVIDER=deepseek, set DEEPSEEK_API_KEY in the environment instead.
#
# Note that a key set here also turns the autodetection described above off:
# the key stays paired with the AI_URL below rather than following an
# unrelated exported variable.
AI_KEY=sk-your-api-key-here

# Optional. API base URL; zagent appends /responses (no Chat Completions fallback).
# Defaults to https://api.openai.com/v1; DeepSeek uses https://api.deepseek.com.
AI_URL=https://api.openai.com/v1

# Optional. Defaults to gpt-4o-mini
# DeepSeek example: deepseek-flash or deepseek-v4-pro. Model names are sent unchanged.
AI_MODEL=gpt-4o-mini

# Optional. Initial Responses max_output_tokens; defaults to 8192, the most
# DeepSeek's chat models accept.
# On token truncation, retry up to 3 times with doubled budgets (growth cap 8192).
# A reply still cut off is continued from where it stopped, up to 8 times.
AI_MAX_TOKENS=8192

# Optional. Defaults to 200
AI_MAX_ITERATIONS=200

# MCP servers are described in a separate file, mcp.json, in the same
# directory as this one — there is no equivalent setting here, and no
# environment variable. See mcp.example.json for its members, and note that
# only this user-level file is read: zagent never starts a server named by a
# file in the directory it happens to be running in.

# These options are environment variables (not config file keys):
# AI_MEMORY_FILE=/path/to/notes.md  # store memory somewhere else
# Tools and local MCP servers run directly with host environment, permissions
# and network access; start in the project directory and only run trusted tasks.
# Zig compiler version: 0.17.0.

# ChatGPT subscription: run `zagent login`, then select this provider.
# Uses the official Codex backend; no API key or custom AI_URL.
# AI_PROVIDER=codex
# AI_MODEL=gpt-5.4
# Optional, Codex only. Omitted from requests when unset or empty.
# Sent as reasoning.effort and service_tier respectively; values are passed
# through unchanged, and support depends on the selected model/backend.
# AI_REASONING_EFFORT=high
# AI_SERVICE_TIER=fast
